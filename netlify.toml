[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA: qualquer rota cai no index.html (arquivos reais são servidos antes disto).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# O service worker não pode ficar em cache, senão o app trava numa versão antiga.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
