[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# SPA: qualquer rota cai no index.html. A API vem antes para não ser engolida.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/dados"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# O service worker não pode ficar em cache, senão o app trava numa versão antiga.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
